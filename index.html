  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background 0.6s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.75);
    }
    .bottom-nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
    .touch-press {
      transition: transform 0.14s ease, background-color 0.15s ease;
    }
    .touch-press:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 bg-gradient-to-br from-orange-100 via-rose-100 to-amber-100">
  <div id="app-shell" class="max-w-lg mx-auto min-h-screen flex flex-col px-4 pt-5 pb-28">
    <!-- Compact Mobile App Top Bar -->
    <header class="flex items-center justify-between gap-3 mb-5">
      <div class="flex items-center gap-2.5">
        <h1 class="text-xl font-bold tracking-tight text-slate-900">오늘의 음악</h1>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="btn-taste" type="button" class="touch-press px-3 py-2 rounded-xl text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-100 shadow-sm min-h-[36px] flex items-center gap-1">
          <span>내 취향</span>
          <span id="taste-count-badge" class="hidden px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-indigo-600 text-white">0</span>
        </button>
        <button id="btn-reset" type="button" class="touch-press px-3 py-2 rounded-xl text-xs font-semibold bg-white/80 hover:bg-white text-slate-600 border border-slate-200/80 shadow-sm min-h-[36px]">
          초기화
        </button>
      </div>
    </header>

    <!-- Tab 1: 상태 고르기 -->
    <main id="view-select" class="space-y-3 flex-1">
      <div class="glass-card rounded-3xl p-4 shadow-lg space-y-2.5">
        <!-- 1. 시간 -->
        <div class="rounded-2xl border border-slate-200/80 bg-white/80 overflow-hidden">
          <button type="button" data-toggle-section="time" class="touch-press w-full px-4 py-3.5 min-h-[52px] flex items-center justify-between gap-2 text-left">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0">1</span>
              <span class="text-sm font-bold text-slate-800">시간</span>
            </div>
            <div class="flex items-center gap-2 min-w-0">
              <span id="badge-time" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 truncate"></span>
              <svg id="chevron-time" class="w-4 h-4 text-slate-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>
          <div id="panel-time" class="hidden px-3.5 pb-3.5 pt-1 border-t border-slate-100">
            <div id="time-options" class="grid grid-cols-2 gap-2 mt-2"></div>
          </div>
        </div>

        <!-- 2. 날씨 -->
        <div class="rounded-2xl border border-slate-200/80 bg-white/80 overflow-hidden">
          <button type="button" data-toggle-section="weather" class="touch-press w-full px-4 py-3.5 min-h-[52px] flex items-center justify-between gap-2 text-left">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0">2</span>
              <span class="text-sm font-bold text-slate-800">날씨</span>
            </div>
            <div class="flex items-center gap-2 min-w-0">
              <span id="badge-weather" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 truncate"></span>
              <svg id="chevron-weather" class="w-4 h-4 text-slate-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>
          <div id="panel-weather" class="hidden px-3.5 pb-3.5 pt-1 border-t border-slate-100">
            <div id="weather-options" class="grid grid-cols-2 gap-2 mt-2"></div>
          </div>
        </div>

        <!-- 3. 지금 기분 -->
        <div class="rounded-2xl border border-slate-200/80 bg-white/80 overflow-hidden">
          <button type="button" data-toggle-section="currentMood" class="touch-press w-full px-4 py-3.5 min-h-[52px] flex items-center justify-between gap-2 text-left">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0">3</span>
              <span class="text-sm font-bold text-slate-800">지금 기분</span>
            </div>
            <div class="flex items-center gap-2 min-w-0">
              <span id="badge-currentMood" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 truncate"></span>
              <svg id="chevron-currentMood" class="w-4 h-4 text-slate-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>
          <div id="panel-currentMood" class="hidden px-3.5 pb-3.5 pt-1 border-t border-slate-100">
            <div id="current-mood-options" class="grid grid-cols-2 gap-2 mt-2"></div>
          </div>
        </div>

        <!-- 4. 내게 필요한 것 -->
        <div class="rounded-2xl border border-slate-200/80 bg-white/80 overflow-hidden">
          <button type="button" data-toggle-section="targetMood" class="touch-press w-full px-4 py-3.5 min-h-[52px] flex items-center justify-between gap-2 text-left">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0">4</span>
              <span class="text-sm font-bold text-slate-800">내게 필요한 것</span>
            </div>
            <div class="flex items-center gap-2 min-w-0">
              <span id="badge-targetMood" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 truncate"></span>
              <svg id="chevron-targetMood" class="w-4 h-4 text-slate-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>
          <div id="panel-targetMood" class="hidden px-3.5 pb-3.5 pt-1 border-t border-slate-100">
            <div id="target-mood-options" class="grid grid-cols-2 gap-2 mt-2"></div>
          </div>
        </div>

        <!-- 5. 장르 -->
        <div class="rounded-2xl border border-slate-200/80 bg-white/80 overflow-hidden">
          <button type="button" data-toggle-section="genre" class="touch-press w-full px-4 py-3.5 min-h-[52px] flex items-center justify-between gap-2 text-left">
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0">5</span>
              <span class="text-sm font-bold text-slate-800">장르</span>
            </div>
            <div class="flex items-center gap-2 min-w-0">
              <span id="badge-genre" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 truncate"></span>
              <svg id="chevron-genre" class="w-4 h-4 text-slate-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>
          <div id="panel-genre" class="hidden px-3.5 pb-3.5 pt-1 border-t border-slate-100">
            <div id="genre-options" class="grid grid-cols-2 gap-2 mt-2"></div>
          </div>
        </div>

        <button id="btn-recommend" type="button" class="touch-press mt-2 w-full py-3.5 min-h-[48px] rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-md">
          추천받기
        </button>
      </div>
    </main>

    <!-- Tab 2: 추천 결과 -->
    <main id="view-recommend" class="hidden space-y-3 flex-1">
      <div id="recommendations-list" class="space-y-3"></div>
      <div id="recommend-actions" class="hidden">
        <button id="btn-reroll" type="button" class="touch-press w-full py-3.5 min-h-[48px] rounded-2xl bg-white/90 hover:bg-white text-indigo-700 text-sm font-bold border border-indigo-200 shadow-sm">
          다른 곡 다시 추천받기
        </button>
      </div>
    </main>

    <!-- Tab 3: 저장 기록 -->
    <main id="view-saved" class="hidden space-y-3 flex-1">
      <div class="glass-card rounded-3xl p-4 shadow-lg">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-slate-900">저장한 기록</h2>
          <div class="flex items-center gap-2">

    function formatToday() {

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }

    function copyText(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (e) {
        showToast('복사에 실패했습니다.');
      }
      document.body.removeChild(ta);
    }

    function pickFinalFour(pool) {
      {
        const uniq = [];
        const seenA = new Set();
        for (const item of pool) {
          const ak = item.artist.toLowerCase();
          if (!seenA.has(ak)) {
            seenA.add(ak);
            uniq.push(item);
          }
          if (uniq.length >= 4) break;
        }
        if (uniq.length >= 4) return uniq;
      }
      return pool.slice(0, 4);
    }

    function getLocalFallbackRecommendations(excludeKeys = []) {
      const currentIds = new Set(state.currentRecs.map(x => x.id));
      const genreFiltered = state.genre === 'all'
        ? SONGS
        : SONGS.filter(song => song.genres && song.genres.includes(state.genre) && isAllowedForGenre(song));
      const pool = genreFiltered.length > 0 ? genreFiltered : SONGS;
      const scored = pool.map(song => {
        let score = 0;
        if (song.times.includes(state.timeOfDay)) score += 2.5;
        if (song.weathers.includes(state.weather)) score += 2.5;
        if (song.current.includes(state.currentMood)) score += 2.5;
        if (song.target.includes(state.targetMood)) score += 3.5;
        const key = `${song.title}::${song.artist}`.toLowerCase();
        let penalty = 0;
        if (currentIds.has(song.id) || excludeKeys.includes(key)) penalty -= 200;
        else if (state.recentSongIds.includes(song.id)) penalty -= 40;
        const jitter = Math.random() * 4.5;
        return { song, total: score + penalty + jitter };
      });
      scored.sort((a, b) => b.total - a.total);
      const topPool = scored.slice(0, 10).map(item => item.song);
      for (let i = topPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [topPool[i], topPool[j]] = [topPool[j], topPool[i]];
      }
      return pickFinalFour(topPool);
    }

    async function fetchArtistRelatedTags(name) {
      try {
        const url = `https://musicbrainz.org/ws/2/artist/?query=${encodeURIComponent(name)}&limit=1&fmt=json`;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2500);
        const res = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
        clearTimeout(timer);
        if (!res.ok) return [];
        const data = await res.json();
        const artist = data.artists && data.artists[0];
        if (!artist || !Array.isArray(artist.tags)) return [];
        return artist.tags
          .sort((a, b) => (b.count || 0) - (a.count || 0))
          .slice(0, 4)
          .map(t => t.name)
          .filter(Boolean);
      } catch (e) {
        return [];
      }
    }

    function isAllowedForGenre(song, fromStrictClassicalTag = false) {
      if (state.genre !== 'classical') return true;
      if (CLASSICAL_EXCLUDE_RE.test(`${song.title} ${song.artist}`)) return false;
      if (fromStrictClassicalTag) return true;
      return CLASSICAL_COMPOSER_WHITELIST_RE.test(song.artist || '');
    }

    async function queryMusicBrainzRecordings(queryStr, limit = 15, maxOffset = 150, strictClassicalTag = false) {
      const offset = maxOffset > 0 ? Math.floor(Math.random() * maxOffset) : 0;
      const url = `https://musicbrainz.org/ws/2/recording/?query=${encodeURIComponent(queryStr)}&limit=${limit}&offset=${offset}&fmt=json`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);
      try {
        const res = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
        clearTimeout(timer);
        if (!res.ok) return [];
        const data = await res.json();
        const recs = Array.isArray(data.recordings) ? data.recordings : [];
        const seen = new Set();
        const parsed = [];
        for (const r of recs) {
          const title = (r.title || '').trim();
          const credits = Array.isArray(r['artist-credit']) ? r['artist-credit'] : [];
          const artist = credits.map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join('').trim();
          if (!title || !artist || artist === '[unknown]') continue;
          const id = `mb_${r.id}`;
          const dedupKey = `${title}::${artist}`.toLowerCase();
          if (seen.has(dedupKey) || state.recentSongIds.includes(id)) continue;
          seen.add(dedupKey);
          const rTags = Array.isArray(r.tags) ? r.tags.map(t => (t.name || '').toLowerCase()) : [];
          if (strictClassicalTag && rTags.some(t => /rock|pop|metal|jazz|hip hop|electronic|soundtrack|new age|ambient|punk|indie|folk|rnb|soul/.test(t))) continue;
          if (!isAllowedForGenre({ title, artist }, strictClassicalTag)) continue;
          if (queryStr.startsWith('artist:"')) {
            const targetArtist = queryStr.slice(8, -1).trim();
            const lastName = targetArtist.split(/\s+/).pop().toLowerCase();
            if (lastName && !artist.toLowerCase().includes(lastName)) continue;
          }
          parsed.push({ id, title, artist, strictClassical: strictClassicalTag });
        }
        for (let i = parsed.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [parsed[i], parsed[j]] = [parsed[j], parsed[i]];
        }
        return parsed;
      } catch (e) {
        clearTimeout(timer);
        return [];
      }
    }

    function getFavName(fav) {
      return typeof fav === 'string' ? fav : (fav && fav.name ? fav.name : '');

    function getFavTags(fav) {

    async function fetchMusicBrainzTracks() {
      const targetTags = MOOD_TO_MB_TAGS[state.targetMood] || ['pop', 'indie'];
      const weatherTags = WEATHER_TO_MB_TAGS[state.weather] || [];
      const genreTags = state.genre !== 'all' ? (GENRE_TO_MB_TAGS[state.genre] || []) : [];

      let artistTracks = [];
      let tasteTagTracks = [];
      if (state.favArtists.length > 0 && state.genre !== 'classical') {
        const pickFav = state.favArtists[Math.floor(Math.random() * state.favArtists.length)];
        const favName = getFavName(pickFav);
        let favTags = getFavTags(pickFav);
        if (!favTags.length && favName) favTags = await fetchArtistRelatedTags(favName);

        if (favName) {
          artistTracks = await queryMusicBrainzRecordings(`artist:"${favName}"`, 10, 20);
        }
        if (favTags.length > 0) {
          const tTag = favTags[Math.floor(Math.random() * favTags.length)];
          tasteTagTracks = await queryMusicBrainzRecordings(`tag:"${tTag}"`, 12, 120);
        }
      }

      let baseTracks = [];
      if (state.genre === 'classical') {
        const classicalTags = [...GENRE_TO_MB_TAGS.classical];
        for (let i = classicalTags.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [classicalTags[i], classicalTags[j]] = [classicalTags[j], classicalTags[i]];
        }
        const neg = 'NOT tag:rock NOT tag:pop NOT tag:"classic rock" NOT tag:metal NOT tag:jazz NOT tag:electronic NOT tag:soundtrack NOT tag:"new age"';
        const [t1, t2] = await Promise.all([
          queryMusicBrainzRecordings(`tag:"${classicalTags[0]}" AND status:official ${neg}`, 15, 2000, true),
          queryMusicBrainzRecordings(`tag:"${classicalTags[1]}" AND status:official ${neg}`, 15, 2000, true)
        ]);
        baseTracks = [...t1, ...t2];
        for (let i = baseTracks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [baseTracks[i], baseTracks[j]] = [baseTracks[j], baseTracks[i]];
        }
      } else {
        // Hybrid: 1-2 from famous artists + 2-3 from full MusicBrainz DB (status:official)
        const basePool = genreTags.length > 0 ? genreTags : [...targetTags, ...weatherTags];
        const chosenTag = basePool[Math.floor(Math.random() * basePool.length)];
        const artistPool = (state.genre !== 'all' && GENRE_ARTISTS[state.genre])
          ? [...GENRE_ARTISTS[state.genre]]
          : Object.values(GENRE_ARTISTS).flat();
        for (let i = artistPool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [artistPool[i], artistPool[j]] = [artistPool[j], artistPool[i]];
        }
        const pickedArtists = artistPool.slice(0, 2);

        const [a1, a2, globalTracks] = await Promise.all([
          queryMusicBrainzRecordings(`artist:"${pickedArtists[0]}"`, 6, 25),
          queryMusicBrainzRecordings(`artist:"${pickedArtists[1]}"`, 6, 25),
          queryMusicBrainzRecordings(`tag:"${chosenTag}" AND status:official`, 15, 2000)
        ]);

        const famousPart = [];
        if (a1.length) famousPart.push(a1[0]);
        if (a2.length) famousPart.push(a2[0]);

        // Interleave global official DB tracks + famous artist tracks
        baseTracks = [...globalTracks.slice(0, 2), ...famousPart, ...globalTracks.slice(2)];
      }

      // Blend: up to 2 direct artist tracks + up to 1 taste-tag track + mood/genre tracks
      const combined = [];
      const usedKeys = new Set();
      const usedArtists = new Set();
      const pushUnique = (arr, maxCount) => {
        let added = 0;
        for (const item of arr) {
          if (added >= maxCount || combined.length >= 4) break;
          const k = `${item.title}::${item.artist}`.toLowerCase();
          const aKey = item.artist.toLowerCase();
          if (usedKeys.has(k)) continue;
          if (usedArtists.has(aKey)) continue;
          usedKeys.add(k);
          usedArtists.add(aKey);
          combined.push(item);
          added++;
        }
      };

      pushUnique(artistTracks, 2);
      pushUnique(tasteTagTracks, 1);
      pushUnique(baseTracks, 4);
      return combined;
    }

    function openLocalDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        try {
          const req = indexedDB.open('TodaysMusicDB', 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('songs')) {
              const store = db.createObjectStore('songs', { keyPath: 'id' });
              SONGS.forEach(song => store.put({ ...song, source: 'seed' }));
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function saveTracksToIndexedDB(tracks) {
      const db = await openLocalDB();
      if (!db || !tracks.length) return;
      try {
        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        tracks.forEach(t => store.put({
          id: t.id,
          title: t.title,
          artist: t.artist,
          genres: state.genre !== 'all' ? [state.genre] : ['pop'],
          strictClassical: !!t.strictClassical,
          times: [],
          weathers: [],
          current: [],
          target: [],
          source: 'musicbrainz'
        }));
      } catch (e) {}
    }

    async function queryIndexedDB(excludeKeys = []) {
      const db = await openLocalDB();
      if (!db) return getLocalFallbackRecommendations(excludeKeys);
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('songs', 'readonly');
          const req = tx.objectStore('songs').getAll();
          req.onsuccess = () => {
            const allSongs = Array.isArray(req.result) && req.result.length ? req.result : SONGS;
            const currentIds = new Set(state.currentRecs.map(x => x.id));
            const filtered = state.genre === 'all'
              ? allSongs
              : allSongs.filter(song => song.genres && song.genres.includes(state.genre) && isAllowedForGenre(song, !!song.strictClassical));
            const pool = filtered.length > 0 ? filtered : allSongs;
            const scored = pool.map(song => {
              let score = 0;
              if (song.times && song.times.includes(state.timeOfDay)) score += 2.5;
              if (song.weathers && song.weathers.includes(state.weather)) score += 2.5;
              if (song.current && song.current.includes(state.currentMood)) score += 2.5;
              if (song.target && song.target.includes(state.targetMood)) score += 3.5;
              if (state.favArtists.length > 0) {
                const hay = `${song.artist} ${song.title}`.toLowerCase();
                if (state.favArtists.some(f => hay.includes(getFavName(f).toLowerCase()))) score += 4.0;
              }
              const key = `${song.title}::${song.artist}`.toLowerCase();
              let penalty = 0;
              if (currentIds.has(song.id) || excludeKeys.includes(key)) penalty -= 200;
              else if (state.recentSongIds.includes(song.id)) penalty -= 40;
              return { song, total: score + penalty + Math.random() * 4.5 };
            });
            scored.sort((a, b) => b.total - a.total);
            const topPool = scored.slice(0, 10).map(item => item.song);
            for (let i = topPool.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [topPool[i], topPool[j]] = [topPool[j], topPool[i]];
            }
            resolve(pickFinalFour(topPool));
          };
          req.onerror = () => resolve(getLocalFallbackRecommendations(excludeKeys));
        } catch (e) {
          resolve(getLocalFallbackRecommendations(excludeKeys));
        }
      });
    }

    async function tryBackendRecommend() {
      if (!window.location.origin || window.location.origin === 'null' || window.location.protocol === 'file:') return null;
      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            timeOfDay: state.timeOfDay,
            weather: state.weather,
            currentMood: state.currentMood,
            targetMood: state.targetMood,
            genre: state.genre,
            excludeIds: state.currentRecs.map(x => x.id),
            favArtists: state.favArtists.map(f => getFavName(f)).filter(Boolean)
          })
        });
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data.tracks) && data.tracks.length ? data.tracks : null;
      } catch (e) {
        return null;
      }
    }

    async function generateRecommendations() {
      const btn = document.getElementById('btn-recommend');
      const reroll = document.getElementById('btn-reroll');
      btn.disabled = true;
      reroll.disabled = true;
      btn.textContent = '음악 찾는 중...';
      reroll.textContent = '새로운 곡 찾는 중...';

      let picked = await tryBackendRecommend();

      if (!picked) {
        const mbTracks = await fetchMusicBrainzTracks();
        if (mbTracks.length) await saveTracksToIndexedDB(mbTracks);
        picked = mbTracks.slice(0, 4);

        if (picked.length < 4) {
          const excludeKeys = picked.map(x => `${x.title}::${x.artist}`.toLowerCase());
          const dbTracks = await queryIndexedDB(excludeKeys);
          for (const f of dbTracks) {
            if (picked.length >= 4) break;
            const k = `${f.title}::${f.artist}`.toLowerCase();
            if (!excludeKeys.includes(k)) {
              picked.push(f);
              excludeKeys.push(k);
            }
          }
        }
      }

      const newRecent = [...picked.map(x => x.id), ...state.recentSongIds.filter(id => !picked.some(x => x.id === id))];
      state.recentSongIds = newRecent.slice(0, 12);
      persistRecent();

      state.currentRecs = picked;
      state.hasRecommended = true;

      btn.disabled = false;
      reroll.disabled = false;
      btn.textContent = '추천받기';
      reroll.textContent = '다른 곡 다시 추천받기';
    }

    function cleanSearchQuery(song) {
      const primaryArtist = (song.artist || '')
        .split(/[;,&]/)[0]
        .replace(/\([^)]*\)/g, ' ')
        .trim();
      const cleanTitle = (song.title || '')
        .replace(/\((?:feat|ft|remaster|live|mono|stereo|version|edit|bonus)[^)]*\)/gi, ' ')
        .replace(/\[[^\]]*\]/g, ' ')
        .replace(/["'“”‘’:/]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return `${primaryArtist} ${cleanTitle}`.trim();
    }

        const url = `https://musicbrainz.org/ws/2/artist/?query=${encodeURIComponent(query)}&limit=5&fmt=json`;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
        clearTimeout(timer);
        if (!res.ok) throw new Error('err');
        const data = await res.json();
        const artists = Array.isArray(data.artists) ? data.artists : [];
        window.__mbSearchResults = artists.map(a => ({
          name: a.name,
          disambiguation: a.disambiguation || a.country || '',
          tags: Array.isArray(a.tags)
            ? a.tags.sort((x, y) => (y.count || 0) - (x.count || 0)).slice(0, 4).map(t => t.name).filter(Boolean)
            : []
        }));
      } catch (e) {}

      const results = window.__mbSearchResults;
      let html = results.map((a, idx) => {
        const sub = [a.disambiguation, a.tags.slice(0, 3).join(', ')].filter(Boolean).join(' · ');
        return `
          <button type="button" data-pick-artist="${idx}"
            class="w-full px-3 py-2 rounded-xl text-left bg-slate-50 hover:bg-indigo-50 border border-slate-200 transition flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-xs font-bold text-slate-900 truncate">${a.name}</p>
              <p class="text-[10px] text-slate-500 truncate">${sub || '태그 없음'}</p>
            </div>
            <span class="text-[11px] font-bold text-indigo-600 shrink-0">선택</span>
          </button>
        `;
      }).join('');

      if (results.length === 0) {
        html = '<p class="text-xs text-rose-500 bg-rose-50 border border-rose-100 rounded-xl px-3 py-2.5">검색 결과가 없어 추가할 수 없어요. 한글 이름은 한글로, 영어 이름은 영어로 다시 검색해 보세요.</p>';
      }
      box.innerHTML = html;
    }

    function renderAll() {
      renderTasteModal();
      renderAccordions();
      renderRecommendations();
      renderSavedView();
      renderTabs();
    }

    document.getElementById('app-shell').addEventListener('click', (e) => {
      const toggleBtn = e.target.closest('button[data-toggle-section]');
      if (toggleBtn) {
        const key = toggleBtn.dataset.toggleSection;
        state.openSections[key] = !state.openSections[key];
        renderAccordions();
        return;
      }

      const optBtn = e.target.closest('button[data-type]');
      if (optBtn) {
        const { type, id } = optBtn.dataset;
        state[type] = id;
        renderAccordions();
        return;
      }

      const saveBtn = e.target.closest('button[data-save-id]');
      if (saveBtn) {
        const songId = saveBtn.dataset.saveId;
        const song = state.currentRecs.find(s => s.id === songId) || SONGS.find(s => s.id === songId);
        if (!song) return;

        const today = formatToday();
        const existingIdx = state.savedRecords.findIndex(r =>
          r.songId === songId &&
          r.date === today &&
          r.timeId === state.timeOfDay &&
          r.weatherId === state.weather &&
          r.currentMoodId === state.currentMood &&
          r.targetMoodId === state.targetMood
        );

        if (existingIdx !== -1) {
          state.savedRecords.splice(existingIdx, 1);
          showToast('저장 목록에서 제거했습니다.');
        } else {
          const timeObj = TIMES.find(t => t.id === state.timeOfDay);
          const wObj = WEATHERS.find(w => w.id === state.weather);
          const cObj = CURRENT_MOODS.find(m => m.id === state.currentMood);
          const tObj = TARGET_MOODS.find(t => t.id === state.targetMood);
          const gObj = GENRES.find(g => g.id === state.genre);
          state.savedRecords.unshift({
            date: today,
            timeId: state.timeOfDay,
            timeLabel: timeObj.label,
            weatherId: state.weather,
            weatherLabel: wObj.label,
            currentMoodId: state.currentMood,
            currentMoodLabel: cObj.label,
            targetMoodId: state.targetMood,
            targetMoodLabel: tObj.label,
            genreLabel: gObj ? gObj.label : '전체',
            songId: song.id,
            title: song.title,
            artist: song.artist
          });
          showToast('날짜와 선택지와 함께 저장했습니다.');
        }
        persistSaved();
        renderRecommendations();
        renderSavedView();
        return;
      }

      const rmBtn = e.target.closest('button[data-remove-idx]');
      if (rmBtn) {
        const idx = Number(rmBtn.dataset.removeIdx);
        state.savedRecords.splice(idx, 1);
        persistSaved();
        renderRecommendations();
        renderSavedView();
        showToast('기록에서 삭제했습니다.');
      }
    });

    document.querySelector('nav.bottom-nav').addEventListener('click', (e) => {
      const tabBtn = e.target.closest('button[data-tab]');
      if (tabBtn) {
        state.activeTab = tabBtn.dataset.tab;
        renderTabs();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    async function handleRecommend() {
      await generateRecommendations();
      state.activeTab = 'recommend';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('btn-recommend').addEventListener('click', handleRecommend);
    document.getElementById('btn-reroll').addEventListener('click', handleRecommend);

    document.getElementById('btn-reset').addEventListener('click', () => {
      state.timeOfDay = 'sunset';
      state.weather = 'rainy';
      state.currentMood = 'tired';
      state.targetMood = 'comfort';
      state.genre = 'all';
      state.hasRecommended = false;
      state.currentRecs = [];
      state.activeTab = 'select';
      renderAll();
      showToast('기본 선택으로 초기화했습니다.');
    });

    document.getElementById('btn-clear-saved').addEventListener('click', () => {
      state.savedRecords = [];
      persistSaved();
      renderAll();
      showToast('저장 기록을 모두 비웠습니다.');
    });

    document.getElementById('btn-copy-saved').addEventListener('click', () => {
      if (state.savedRecords.length === 0) {
        showToast('복사할 기록이 없습니다.');
        return;
      }
      const lines = state.savedRecords.map((r, i) =>
        `${i + 1}. [${r.date}] (${r.timeLabel}/${r.weatherLabel}/${r.currentMoodLabel} -> ${r.targetMoodLabel}) ${r.title} - ${r.artist}`
      );
      copyText(lines.join('\n'), '저장 기록을 복사했습니다.');
    });


    async function fetchArtworkUrl(song) {
      try {
        const q = encodeURIComponent(`${song.artist} ${song.title}`);
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2500);
        const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) return null;
        const data = await res.json();
        if (data.results && data.results[0] && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
        }
      } catch (e) {}
      return null;
    }

    function loadCorsImage(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timer = setTimeout(() => resolve(null), 2500);
        img.onload = () => { clearTimeout(timer); resolve(img); };
        img.onerror = () => { clearTimeout(timer); resolve(null); };
        img.src = url;
      });
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    async function renderShareCard(skipArtwork = false) {
      const song = state.currentRecs.find(x => x.id === state.selectedCardSongId) || state.currentRecs[0];
      if (!song) return;

      const picker = document.getElementById('card-song-picker');
      picker.innerHTML = state.currentRecs.map((item, idx) => {
        const active = item.id === song.id;
        return `
          <button type="button" data-pick-card-id="${item.id}"
            class="px-2.5 py-2 rounded-xl text-left text-[11px] font-semibold border truncate ${
              active ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'
            }">
            ${idx + 1}. ${item.title}
          </button>
        `;
      }).join('');

      const canvas = document.getElementById('share-card-canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      // Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, W, H);
      bgGrad.addColorStop(0, '#eef2ff');
      bgGrad.addColorStop(0.55, '#e0e7ff');
      bgGrad.addColorStop(1, '#fce7f3');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Soft decorative glow
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      drawRoundedRect(ctx, 28, 28, W - 56, H - 56, 36);
      ctx.fill();

      // Date & Header
      ctx.fillStyle = '#4f46e5';
      ctx.font = '700 18px Inter, Noto Sans KR, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(formatToday(), 56, 78);

      // Album cover box
      const coverX = 65;
      const coverY = 116;
      const coverSize = W - 130;

      // Draw fallback cover first
      ctx.save();
      drawRoundedRect(ctx, coverX, coverY, coverSize, coverSize, 28);
      ctx.clip();
      const artGrad = ctx.createLinearGradient(coverX, coverY, coverX + coverSize, coverY + coverSize);
      artGrad.addColorStop(0, '#4f46e5');
      artGrad.addColorStop(0.5, '#6366f1');
      artGrad.addColorStop(1, '#ec4899');
      ctx.fillStyle = artGrad;
      ctx.fillRect(coverX, coverY, coverSize, coverSize);

      // Subtle vinyl/note motif on fallback cover
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(coverX + coverSize / 2, coverY + coverSize / 2, coverSize * 0.3, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '700 84px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('♪', coverX + coverSize / 2, coverY + coverSize / 2 + 28);

      const artworkUrl = skipArtwork ? null : await fetchArtworkUrl(song);
      const img = await loadCorsImage(artworkUrl);
      if (img) {
        ctx.drawImage(img, coverX, coverY, coverSize, coverSize);
      }
      ctx.restore();

      // Song Title & Artist
      ctx.fillStyle = '#0f172a';
      ctx.font = '700 28px Inter, Noto Sans KR, sans-serif';
      ctx.textAlign = 'center';
      const titleText = song.title.length > 22 ? song.title.slice(0, 21) + '…' : song.title;
      ctx.fillText(titleText, W / 2, coverY + coverSize + 64);

      ctx.fillStyle = '#475569';
      ctx.font = '600 20px Inter, Noto Sans KR, sans-serif';
      ctx.fillText(song.artist, W / 2, coverY + coverSize + 102);

    }

    function openCardModal(songId) {
      if (!state.currentRecs.length) return;
      state.selectedCardSongId = songId || state.currentRecs[0].id;
      const modal = document.getElementById('card-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderShareCard();
    }

    const cardModal = document.getElementById('card-modal');
    document.getElementById('btn-close-card').addEventListener('click', () => {
      cardModal.classList.add('hidden');
      cardModal.classList.remove('flex');
    });
    cardModal.addEventListener('click', (e) => {
      if (e.target === cardModal) {
        cardModal.classList.add('hidden');
        cardModal.classList.remove('flex');
      }
      const pickBtn = e.target.closest('button[data-pick-card-id]');
      if (pickBtn) {
        state.selectedCardSongId = pickBtn.dataset.pickCardId;
        renderShareCard();
      }
    });

    document.getElementById('recommendations-list').addEventListener('click', (e) => {
      const cardBtn = e.target.closest('button[data-card-id]');
      if (cardBtn) {
        openCardModal(cardBtn.dataset.cardId);
      }
    });

    document.getElementById('btn-download-card').addEventListener('click', async () => {
      const canvas = document.getElementById('share-card-canvas');
      const triggerDownload = (url) => {
        const a = document.createElement('a');
        a.href = url;
        a.download = `todays_music_${formatToday()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('오늘의 음악 카드를 저장했어요!');
      };
      try {
        triggerDownload(canvas.toDataURL('image/png'));
      } catch (e) {
        await renderShareCard(true);
        try {
          triggerDownload(canvas.toDataURL('image/png'));
        } catch (err) {
          showToast('이미지 저장에 실패했습니다.');
        }
      }
    });

    document.getElementById('btn-share-card').addEventListener('click', async () => {
      const song = state.currentRecs.find(x => x.id === state.selectedCardSongId) || state.currentRecs[0];
      const canvas = document.getElementById('share-card-canvas');
      const shareText = song ? `[오늘의 음악] ${song.title} - ${song.artist}` : '[오늘의 음악]';
      try {
        if (navigator.share) {
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
          if (blob && navigator.canShare) {
            const file = new File([blob], 'todays_music.png', { type: 'image/png' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ title: '오늘의 음악', text: shareText, files: [file] });
              return;
            }
          }
          await navigator.share({ title: '오늘의 음악', text: shareText });
          return;
        }
      } catch (e) {}
      copyText(shareText, '공유 문구를 클립보드에 복사했어요!');
    });


    const tasteModal = document.getElementById('taste-modal');
    document.getElementById('btn-taste').addEventListener('click', () => {
      renderTasteModal();
      tasteModal.classList.remove('hidden');
      tasteModal.classList.add('flex');
    });
    document.getElementById('btn-close-taste').addEventListener('click', () => {
      tasteModal.classList.add('hidden');
      tasteModal.classList.remove('flex');
    });
    tasteModal.addEventListener('click', (e) => {
      if (e.target === tasteModal) {
        tasteModal.classList.add('hidden');
        tasteModal.classList.remove('flex');
      }
      const rmBtn = e.target.closest('button[data-rm-taste]');
      if (rmBtn) {
        const idx = Number(rmBtn.dataset.rmTaste);
        state.favArtists.splice(idx, 1);
        persistFavArtists();
        renderTasteModal();
        return;
      }
      const pickBtn = e.target.closest('button[data-pick-artist]');
      if (pickBtn) {
        const a = (window.__mbSearchResults || [])[Number(pickBtn.dataset.pickArtist)];
        if (a && !state.favArtists.some(f => getFavName(f).toLowerCase() === a.name.toLowerCase())) {
          state.favArtists.push({ name: a.name, tags: a.tags });
          persistFavArtists();
          renderTasteModal();
          showToast(`${a.name} 추가 완료!`);
        }
        document.getElementById('taste-search-results').classList.add('hidden');
        document.getElementById('taste-input').value = '';
        return;
      }

    });
    document.getElementById('taste-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('taste-input');
      const q = input.value.trim();
      if (!q) return;
      searchMusicBrainzArtists(q);
    });

    renderAll();
  </script>
</body>
